# ==============================================================================
# FIRST-TIME CONNECTION (Use this for the very first playbook run)
# ==============================================================================
# Connects to your fresh Ubuntu instance using the default SSH port (22)
# and your temporary or initial OS setup user account.

[my_servers]
192.168.122.66 ansible_user=u


# ==============================================================================
# POST-HARDENING CONNECTION (Uncomment this and comment out the top section later)
# ==============================================================================
# After the playbook runs once, port 22 is hardened and your new user is ready.
# This configuration switches tracking over to port 2222 and your admin deployment account.

# [my_servers]
# 192.168.122.66 ansible_user=sysadmin ansible_port=2222
